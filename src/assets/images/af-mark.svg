<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <g fill="none" stroke="#15171C" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <!-- shared stem: A's right side doubles as F's spine -->
    <line x1="130" y1="20" x2="130" y2="170" />
    <!-- A's diagonal leg -->
    <line x1="130" y1="20" x2="40" y2="170" />
    <!-- A's crossbar -->
    <line x1="88" y1="100" x2="130" y2="100" />
    <!-- F's top arm -->
    <line x1="130" y1="20" x2="185" y2="20" />
    <!-- F's middle arm -->
    <line x1="130" y1="85" x2="170" y2="85" />
  </g>
</svg>
